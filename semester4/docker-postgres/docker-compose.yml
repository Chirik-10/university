services:
  db:
    image: postgres:latest
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    restart: always

  app:
    build: ./app
    depends_on:
      - db
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app
      - /app/node_modules

volumes:
  db:

